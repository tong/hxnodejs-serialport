name: test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: Setup haxe
        run: |
          haxe --version
          haxelib dev hxnodejs-serialport .
          haxelib install hxnodejs
      - name: Build haxedoc.xml
        run: |
          haxe doc.hxml
      - name: Build example
        run: |
          haxe --cwd example build.hxml
